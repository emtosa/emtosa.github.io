title: "Kernel — Technical Writing on AI & Developer Tools"
description: "Personal blog exploring AI, productivity, and developer workflows"
url: "https://emtosa.com"
baseurl: ""

# Build settings
theme: minima
markdown: kramdown
highlighter: rouge

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Pagination (optional, add jekyll-paginate to Gemfile to enable)
# paginate: 5
# paginate_path: "/page:num/"

permalink: /posts/:year/:month/:day/:title/

exclude:
  - README.md
  - scripts/
  - Gemfile
  - Gemfile.lock
  - .git/
